[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-rag-stack"
version = "0.1.0"
description = "Local, hybrid document RAG stack for production appliances."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "ProConnect Engineering" },
]
keywords = ["rag", "documents", "ollama", "mlx", "local-ai", "colqwen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core runtime
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "click>=8.1",
    "httpx>=0.27",
    "requests>=2.31",
    "numpy>=1.26,<3.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    # Default vector store
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.2.0"]
docling = ["docling>=2.0.0"]
marker = ["marker-pdf>=1.0.0"]
visual = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "colpali-engine>=0.3.0",
]
mlx = [
    "mlx>=0.15",
    "mlx-vlm>=0.1",
    "mlx-embeddings>=0.1",
]
qdrant = ["qdrant-client>=1.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = [
    "local-rag-stack[ollama,docling,marker,visual,mlx,qdrant,dev]",
]

[project.scripts]
lrs = "local_rag_stack.cli:main"

[project.urls]
Repository = "https://github.com/proconnect/local-rag-stack"

[tool.hatch.build.targets.wheel]
packages = ["src/local_rag_stack"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
